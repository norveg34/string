<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #f5f6f8;
            --container: white;
            --text: #111;
            --input: white;
            --border: #ccc;
            --primary: #007bff;
            --result-bg: #eaf3ff;
        }

        body.dark {
            --background: #111;
            --container: #1e1e1e;
            --text: #fff;
            --input: #2b2b2b;
            --border: #555;
            --primary: #4da3ff;
            --result-bg: #203449;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            transition: 0.2s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--container);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        select,
        input,
        button {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 17px;
            background: var(--input);
            color: var(--text);
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input:disabled,
        select:disabled {
            opacity: 0.6;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #result {
            text-align: center;
            margin-top: 20px;
        }

        .sor {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            padding: 20px;
            border-radius: 10px;
            background: var(--result-bg);
            margin-bottom: 10px;
        }

        .nincs {
            font-size: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>String kereső</h2>

    <!-- FEKETE / FEHÉR MÓD -->
    <button id="themeButton" onclick="toggleTheme()">
        🌙 Fekete mód
    </button>

    <div id="status">
        ⏳ Betöltés...
    </div>


    <!-- EXCEL VÁLASZTÁS -->
    <select id="fileSelect" onchange="excelValasztas()">

        <option value="SLK2_combiner.xlsx">
            SLK2 Combiner
        </option>

        <option value="SLK1_combiner.xlsx">
            SLK1 Combiner
        </option>

    </select>


    <!-- TERÜLET -->
    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">
            Válassz területet
        </option>
    </select>


    <!-- STRING -->
    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        oninput="kereses()"
        autocomplete="off"
    >


    <!-- EREDMÉNY -->
    <div id="result"></div>

</div>


<script>

let tableData = [];


/*
 * ==========================================================
 * INDULÁS
 * ==========================================================
 */

window.addEventListener("DOMContentLoaded", () => {

    // Téma betöltése
    const savedTheme =
        localStorage.getItem("theme");

    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";
    }

    // Alapértelmezett Excel
    excelBetoltes("SLK2_combiner.xlsx");

});


/*
 * ==========================================================
 * FEKETE / FEHÉR MÓD
 * ==========================================================
 */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    if (dark) {

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";

        localStorage.setItem(
            "theme",
            "dark"
        );

    } else {

        document.getElementById(
            "themeButton"
        ).textContent = "🌙 Fekete mód";

        localStorage.setItem(
            "theme",
            "light"
        );
    }
}


/*
 * ==========================================================
 * EXCEL VÁLTÁS
 * ==========================================================
 */

function excelValasztas() {

    const file =
        document.getElementById(
            "fileSelect"
        ).value;

    excelBetoltes(file);
}


/*
 * ==========================================================
 * EXCEL BETÖLTÉS
 * ==========================================================
 */

function excelBetoltes(fileName) {

    const status =
        document.getElementById("status");

    const select =
        document.getElementById(
            "teruletSelect"
        );

    const input =
        document.getElementById(
            "searchInput"
        );

    const result =
        document.getElementById(
            "result"
        );


    /*
     * Reset
     */

    tableData = [];

    select.innerHTML =
        '<option value="">Válassz területet</option>';

    select.disabled = true;

    input.disabled = true;
    input.value = "";

    result.innerHTML = "";

    status.innerHTML =
        "⏳ " +
        fileName +
        " betöltése...";


    /*
     * Excel betöltése
     */

    fetch(fileName)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Az Excel fájl nem található!"
                );
            }

            return response.arrayBuffer();
        })

        .then(buffer => {

            const workbook =
                XLSX.read(
                    new Uint8Array(buffer),
                    {
                        type: "array"
                    }
                );


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            /*
             * Excel sorok
             */

            const rawData =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        header: 1,
                        defval: ""
                    }
                );


            /*
             * ==================================================
             * FONTOS:
             *
             * Pontosan ugyanaz a struktúra,
             * mint a régi működő kódodban.
             *
             * 1. oszlop = ROW
             * 2. oszlop = 1. STRING
             * 3. oszlop = 2. STRING
             * 4. oszlop = 3. STRING
             * 5. oszlop = TERULET
             *
             * DE:
             *
             * Most a 4. STRING miatt
             * az 5. oszlop továbbra is TERULET
             * csak akkor, ha az Excel valóban így van.
             *
             * Ha a combiner Excel:
             *
             * ROW
             * STRING1
             * STRING2
             * STRING3
             * STRING4
             * TERULET
             *
             * akkor a TERULET a 6. oszlop,
             * ezért itt row[5].
             * ==================================================
             */


            tableData =
                rawData
                    .slice(1)
                    .map(row => ({

                        row:
                            row[0],

                        string1:
                            row[1],

                        string2:
                            row[2],

                        string3:
                            row[3],

                        string4:
                            row[4],

                        terulet:
                            row[5]

                    }));


            /*
             * ==================================================
             * TERÜLETEK
             * ==================================================
             */

            const teruletek =
                [
                    ...new Set(

                        tableData
                            .map(item =>
                                String(
                                    item.terulet ?? ""
                                ).trim()
                            )

                            .filter(
                                x =>
                                    x !== "" &&
                                    x !== "undefined" &&
                                    x !== "null"
                            )
                    )
                ];


            /*
             * Területek feltöltése
             */

            teruletek
                .sort(
                    (a, b) =>
                        a.localeCompare(
                            b,
                            "hu"
                        )
                )

                .forEach(terulet => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        terulet;

                    option.textContent =
                        terulet;

                    select.appendChild(
                        option
                    );
                });


            /*
             * Engedélyezés
             */

            select.disabled = false;


            status.innerHTML =
                " ";


        })

        .catch(error => {

            status.innerHTML =
                "❌ " +
                error.message;

        });
}


/*
 * ==========================================================
 * TERÜLET VÁLASZTÁS
 * ==========================================================
 */

function teruletValasztas() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;

    const input =
        document.getElementById(
            "searchInput"
        );

    const result =
        document.getElementById(
            "result"
        );


    if (!terulet) {

        input.disabled = true;

        input.value = "";

        result.innerHTML = "";

        return;
    }


    input.disabled = false;

    input.focus();

    result.innerHTML = "";
}


/*
 * ==========================================================
 * KERESÉS
 * ==========================================================
 */

function kereses() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;


    const keresett =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();


    const result =
        document.getElementById(
            "result"
        );


    if (
        !terulet ||
        !keresett
    ) {

        result.innerHTML = "";

        return;
    }


    /*
     * Keresés mind a 4 STRING oszlopban
     */

    const talalatok =
        tableData.filter(item => {

            const rowTerulet =
                String(
                    item.terulet ?? ""
                )
                    .trim();


            const s1 =
                String(
                    item.string1 ?? ""
                )
                    .trim()
                    .toLowerCase();


            const s2 =
                String(
                    item.string2 ?? ""
                )
                    .trim()
                    .toLowerCase();


            const s3 =
                String(
                    item.string3 ?? ""
                )
                    .trim()
                    .toLowerCase();


            const s4 =
                String(
                    item.string4 ?? ""
                )
                    .trim()
                    .toLowerCase();


            return (
                rowTerulet === terulet &&

                (
                    s1.includes(keresett) ||
                    s2.includes(keresett) ||
                    s3.includes(keresett) ||
                    s4.includes(keresett)
                )
            );

        });


    /*
     * Nincs találat
     */

    if (
        talalatok.length === 0
    ) {

        result.innerHTML =
            `<div class="nincs">
                Nincs találat
            </div>`;

        return;
    }


    /*
     * Találatok
     */

    result.innerHTML =
        talalatok

            .map(item =>
                `<div class="sor">
                    ${escapeHtml(item.row)}
                </div>`
            )

            .join("");
}


/*
 * ==========================================================
 * HTML BIZTONSÁG
 * ==========================================================
 */

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
