    <title>String kereső</title>

    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #111111;
            --secondary: #666666;

</head>

<body>

<div class="container">

    <h2>Combiner kereső</h2>

    <div class="topbar">
        <button id="themeButton" onclick="toggleTheme()">
            🌙 Fekete mód
        </button>
    </div>

    <div id="status">
        ⏳ Betöltés...
    </div>

    <!-- ADATFORRÁS -->
    <label class="label">
        Adatforrás
    </label>

    <select id="forrasSelect" onchange="forrasValasztas()">
        <option value="SLK2_String.xlsx">
            SLK2 String
        </option>

        <option value="SLK2_combiner.xlsx">
            SLK2 Combiner
        </option>

        <option value="SLK1_combiner.xlsx">
            SLK1 Combiner
        </option>
    </select>

    <!-- TERÜLET -->
    <label class="label">
        Terület
    </label>

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">
            Válassz területet
        </option>
    </select>

    <!-- STRING -->
    <label class="label">
        String keresés
    </label>

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        oninput="kereses()"
        autocomplete="off"
    >

    <!-- EREDMÉNY -->
    <div id="result"></div>

    <div class="info">
        SLK String kereső
    </div>

</div>


<script>

    /*
     * ============================================================
     * BEÁLLÍTÁSOK
     * ============================================================
     */

    let tableData = [];

    let currentFile = "SLK2_String.xlsx";


    /*
     * ============================================================
     * OLDAL BETÖLTÉS
     * ============================================================
     */

    window.addEventListener("DOMContentLoaded", () => {

        // Téma betöltése
        const savedTheme = localStorage.getItem("stringTheme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
            document.getElementById("themeButton").textContent =
                "☀️ Fehér mód";
        }

        // Első Excel betöltése
        excelBetoltes(currentFile);

        // Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .catch(() => {
                    // Nem probléma, ha localhost nélkül fut
                });
        }
    });


    /*
     * ============================================================
     * FEKETE / FEHÉR MÓD
     * ============================================================
     */

    function toggleTheme() {

        document.body.classList.toggle("dark");

        const dark =
            document.body.classList.contains("dark");

        if (dark) {

            document.getElementById("themeButton").textContent =
                "☀️ Fehér mód";

            localStorage.setItem(
                "stringTheme",
                "dark"
            );

        } else {

            document.getElementById("themeButton").textContent =
                "🌙 Fekete mód";

            localStorage.setItem(
                "stringTheme",
                "light"
            );
        }
    }


    /*
     * ============================================================
     * FORRÁS VÁLTÁSA
     * ============================================================
     */

    function forrasValasztas() {

        const select =
            document.getElementById("forrasSelect");

        currentFile = select.value;

        excelBetoltes(currentFile);
    }


    /*
     * ============================================================
     * EXCEL BETÖLTÉSE
     * ============================================================
     */

    function excelBetoltes(fileName) {

        const status =
            document.getElementById("status");

        const teruletSelect =
            document.getElementById("teruletSelect");

        const searchInput =
            document.getElementById("searchInput");

        const result =
            document.getElementById("result");


        // Reset

        tableData = [];

        teruletSelect.innerHTML =
            '<option value="">Válassz területet</option>';

        teruletSelect.disabled = true;

        searchInput.disabled = true;
        searchInput.value = "";

        result.innerHTML = "";

        status.textContent =
            "⏳ " + fileName + " betöltése...";


        fetch(fileName)

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        fileName +
                        " nem található!"
                    );
                }

                return response.arrayBuffer();
            })

            .then(buffer => {

                const workbook =
                    XLSX.read(
                        new Uint8Array(buffer),
                        {
                            type: "array"
                        }
                    );


                if (
                    !workbook.SheetNames ||
                    workbook.SheetNames.length === 0
                ) {
                    throw new Error(
                        "Az Excelben nincs munkalap."
                    );
                }


                const sheet =
                    workbook.Sheets[
                        workbook.SheetNames[0]
                    ];


                /*
                 * header: 1
                 * azért használjuk, hogy pontosan lássuk
                 * az Excel eredeti oszlopait.
                 */

                const rawData =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {
                            header: 1,
                            defval: ""
                        }
                    );


                if (rawData.length === 0) {

                    throw new Error(
                        "Az Excel üres."
                    );
                }


                /*
                 * ====================================================
                 * FEJLÉC FELISMERÉSE
                 * ====================================================
                 */

                const header =
                    rawData[0].map(value =>
                        normalizalFejlec(value)
                    );


                /*
                 * TERÜLET OSZLOP
                 *
                 * Fontos:
                 * nem fix oszlopot használunk.
                 */

                let teruletIndex =
                    header.findIndex(
                        value =>
                            value === "TERULET" ||
                            value === "AREA" ||
                            value === "TERULETNEV"
                    );


                /*
                 * Ha nincs TERULET fejléc,
                 * megpróbáljuk megtalálni azt az oszlopot,
                 * amelynek a fejlécében szerepel a terulet szó.
                 */

                if (teruletIndex === -1) {

                    teruletIndex =
                        header.findIndex(
                            value =>
                                value.includes("TERULET")
                        );
                }


                /*
                 * Ha továbbra sincs:
                 * a régi Excel struktúrát használjuk.
                 *
                 * Régi szerkezet:
                 * ROW
                 * STRING1
                 * STRING2
                 * STRING3
                 * STRING4
                 * TERULET
                 */

                if (teruletIndex === -1) {

                    if (rawData[0].length >= 6) {

                        teruletIndex = 5;

                    } else if (rawData[0].length >= 5) {

                        teruletIndex = 4;

                    } else {

                        throw new Error(
                            "Nem található TERULET oszlop az Excelben."
                        );
                    }
                }


                /*
                 * ====================================================
                 * STRING OSZLOPOK FELISMERÉSE
                 * ====================================================
                 */

                let stringIndexes = [];


                header.forEach(
                    (value, index) => {

                        if (
                            value.includes("STRING")
                        ) {
                            stringIndexes.push(index);
                        }

                    }
                );


                /*
                 * Maximum 4 STRING oszlop.
                 */

                stringIndexes =
                    stringIndexes.slice(0, 4);


                /*
                 * Ha fejléc alapján nincs STRING,
                 * akkor a régi struktúrából vesszük.
                 */

                if (stringIndexes.length === 0) {

                    stringIndexes = [
                        1,
                        2,
                        3,
                        4
                    ].filter(
                        index =>
                            index < rawData[0].length &&
                            index !== teruletIndex
                    );

                }


                /*
                 * ====================================================
                 * ROW OSZLOP
                 * ====================================================
                 */

                let rowIndex =
                    header.findIndex(
                        value =>
                            value === "ROW" ||
                            value === "SOR"
                    );


                if (rowIndex === -1) {
                    rowIndex = 0;
                }


                /*
                 * ====================================================
                 * ADATOK FELDOLGOZÁSA
                 * ====================================================
                 */

                tableData =
                    rawData
                        .slice(1)
                        .map(row => {

                            const terulet =
                                String(
                                    row[teruletIndex] ?? ""
                                ).trim();


                            /*
                             * Nagyon fontos:
                             * undefined / null / üres területet
                             * NEM teszünk bele.
                             */

                            if (!terulet) {
                                return null;
                            }


                            const strings =
                                stringIndexes.map(
                                    index =>
                                        String(
                                            row[index] ?? ""
                                        ).trim()
                                );


                            return {

                                row:
                                    String(
                                        row[rowIndex] ?? ""
                                    ).trim(),

                                strings:
                                    strings,

                                terulet:
                                    terulet
                            };

                        })
                        .filter(item =>
                            item !== null
                        );


                /*
                 * ====================================================
                 * TERÜLETEK
                 * ====================================================
                 */

                const teruletek =
                    [
                        ...new Set(
                            tableData
                                .map(
                                    item =>
                                        item.terulet
                                )
                                .filter(
                                    value =>
                                        value &&
                                        value !== "undefined" &&
                                        value !== "null"
                                )
                        )
                    ];


                /*
                 * ABC sorrend
                 */

                teruletek.sort(
                    (a, b) =>
                        a.localeCompare(
                            b,
                            "hu",
                            {
                                sensitivity: "base"
                            }
                        )
                );


                /*
                 * Dropdown feltöltése
                 */

                teruletek.forEach(
                    terulet => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            terulet;

                        option.textContent =
                            terulet;

                        teruletSelect.appendChild(
                            option
                        );

                    }
                );


                /*
                 * Kész
                 */

                teruletSelect.disabled =
                    teruletek.length === 0;


                status.textContent =
                    "✅ " +
                    fileName +
                    " betöltve – " +
                    tableData.length +
                    " sor, " +
                    teruletek.length +
                    " terület";


                /*
                 * Ha nincs terület
                 */

                if (teruletek.length === 0) {

                    status.innerHTML =
                        "⚠️ Nem található érvényes TERULET adat.";
                }

            })

            .catch(error => {

                console.error(error);

                status.innerHTML =
                    '<span class="hiba">❌ ' +
                    escapeHtml(
                        error.message
                    ) +
                    "</span>";

            });
    }


    /*
     * ============================================================
     * FEJLÉC NORMALIZÁLÁS
     * ============================================================
     */

    function normalizalFejlec(value) {

        return String(
            value ?? ""
        )
            .trim()
            .toUpperCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /[^A-Z0-9]/g,
                ""
            );
    }


    /*
     * ============================================================
     * TERÜLET VÁLASZTÁS
     * ============================================================
     */

    function teruletValasztas() {

        const terulet =
            document.getElementById(
                "teruletSelect"
            ).value;

        const input =
            document.getElementById(
                "searchInput"
            );

        const result =
            document.getElementById(
                "result"
            );


        if (!terulet) {

            input.disabled = true;
            input.value = "";

            result.innerHTML = "";

            return;
        }


        input.disabled = false;

        input.value = "";

        result.innerHTML = "";

        input.focus();
    }


    /*
     * ============================================================
     * KERESÉS
     * ============================================================
     */

    function kereses() {

        const terulet =
            document.getElementById(
                "teruletSelect"
            ).value;


        const keresett =
            document.getElementById(
                "searchInput"
            ).value
                .trim()
                .toLowerCase();


        const result =
            document.getElementById(
                "result"
            );


        if (
            !terulet ||
            !keresett
        ) {

            result.innerHTML = "";

            return;
        }


        /*
         * Terület + mindegyik STRING mező
         */

        const talalatok =
            tableData.filter(
                item => {

                    if (
                        item.terulet !==
                        terulet
                    ) {
                        return false;
                    }


                    return item.strings.some(
                        stringValue =>
                            String(
                                stringValue
                            )
                                .toLowerCase()
                                .includes(
                                    keresett
                                )
                    );

                }
            );


        /*
         * Nincs találat
         */

        if (
            talalatok.length === 0
        ) {

            result.innerHTML =
                '<div class="nincs">' +
                "Nincs találat" +
                "</div>";

            return;
        }


        /*
         * Találatok
         */

        result.innerHTML =
            talalatok
                .map(
                    item =>
                        `<div class="sor">
                            ${escapeHtml(item.row)}
                        </div>`
                )
                .join("");
    }


    /*
     * ============================================================
     * HTML ESCAPE
     * ============================================================
     */

    function escapeHtml(value) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

</script>

</body>
</html>
