<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f0f4f9" id="metaThemeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="String kereső">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* VILÁGOS MÓD - Rendkívül változatos, áramló Gemini hullám */
        body.light-mode {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #f8fafc, #fed7aa, #e2e8f0, #fbcfe8, #bfdbfe, #ddd6fe, #f1f5f9);
            background-size: 500% 500%;
            animation: geminiSuperWave 10s ease infinite;
            color: #1e293b;
        }

        /* SÖTÉT MÓD - Rendkívül változatos, áramló Gemini hullám */
        body.dark-mode {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #05070b, #1e1b4b, #0f172a, #3b0764, #172554, #4c1d95, #090d16);
            background-size: 500% 500%;
            animation: geminiSuperWave 10s ease infinite;
            color: #f3f4f6;
        }

        @keyframes geminiSuperWave {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 24px;
            position: relative;
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        body.light-mode .container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        body.dark-mode .container {
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        body.light-mode .theme-toggle { background: rgba(0, 0, 0, 0.05); }
        body.dark-mode .theme-toggle { background: rgba(255, 255, 255, 0.1); }

        h2 {
            text-align: center;
            margin: 0 0 20px;
            font-size: 24px;
        }

        body.light-mode h2 {
            background: linear-gradient(90deg, #2563eb, #9333ea, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark-mode h2 {
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        select,
        input {
            width: 100%;
            height: 50px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 17px;
        }

        body.light-mode select,
        body.light-mode input {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #cbd5e1;
            color: #1e293b;
        }

        body.dark-mode select,
        body.dark-mode input {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f3f4f6;
        }

        body.dark-mode select option {
            background: #111827;
            color: #f3f4f6;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        input:disabled,
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 15px;
        }

        body.light-mode #status { color: #dc2626; }
        body.dark-mode #status { color: #f87171; }

        #result {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            max-height: 350px;
            overflow-y: auto;
            padding: 5px;
        }

        /* MOZGÓ, PULZÁLÓ BUBORÉKOK */
        .sor {
            min-width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            word-break: break-all;
            animation: bubbleFloat 4s ease-in-out infinite, fadeIn 0.3s ease-in-out;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* Eltérő animációs fázisok, hogy ne egyszerre mozogjanak a buborékok */
        .sor:nth-child(odd) {
            animation-duration: 3.5s;
        }
        .sor:nth-child(even) {
            animation-duration: 4.5s;
            animation-delay: 0.5s;
        }

        @keyframes bubbleFloat {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.05);
            }
        }

        body.light-mode .sor {
            background: radial-gradient(circle at 30% 30%, rgba(147, 51, 234, 0.15), rgba(37, 99, 235, 0.25));
            border: 2px solid rgba(147, 51, 234, 0.3);
            color: #1e293b;
        }

        body.dark-mode .sor {
            background: radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.3), rgba(59, 130, 246, 0.4));
            border: 2px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.25);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .nincs {
            font-size: 18px;
            padding: 10px;
            width: 100%;
            text-align: center;
        }
        body.light-mode .nincs { color: #64748b; }
        body.dark-mode .nincs { color: #9ca3af; }
    </style>
</head>

<body class="light-mode" id="pageBody">

<div class="container">
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Téma váltása">🌙</button>

    <h2>String kereső</h2>

    <div id="status"></div>

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">Válassz területet</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        oninput="kereses()"
    >

    <div id="result"></div>

</div>

<script>
(function() {
    const savedTheme = localStorage.getItem("theme") || "light-mode";
    const body = document.getElementById("pageBody");
    const btn = document.getElementById("themeToggleBtn");
    const metaTheme = document.getElementById("metaThemeColor");

    body.className = savedTheme;
    if (savedTheme === "dark-mode") {
        btn.textContent = "☀️";
        metaTheme.content = "#05070b";
    } else {
        btn.textContent = "🌙";
        metaTheme.content = "#f0f4f9";
    }
})();

function toggleTheme() {
    const body = document.getElementById("pageBody");
    const btn = document.getElementById("themeToggleBtn");
    const metaTheme = document.getElementById("metaThemeColor");

    if (body.classList.contains("light-mode")) {
        body.className = "dark-mode";
        btn.textContent = "☀️";
        metaTheme.content = "#05070b";
        localStorage.setItem("theme", "dark-mode");
    } else {
        body.className = "light-mode";
        btn.textContent = "🌙";
        metaTheme.content = "#f0f4f9";
        localStorage.setItem("theme", "light-mode");
    }
}

let tableData = [];

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .catch(error => console.error("Service Worker hiba:", error));
    });
}

window.addEventListener(
    "DOMContentLoaded",
    () => {
        fetch("./SLK2_combiner.xlsx")
            .then(response => {
                if (!response.ok) throw new Error("Az Excel fájl nem található!");
                return response.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(new Uint8Array(buffer), { type: "array" });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

                tableData = rawData
                    .slice(1)
                    .map(row => ({
                        row: row[0],
                        string1: row[1],
                        string2: row[2],
                        string3: row[3],
                        string4: row[4],
                        terulet: row[5]
                    }));

                const teruletek = [
                    ...new Set(
                        tableData
                            .map(item => String(item.terulet).trim())
                            .filter(x => x !== "")
                    )
                ];

                const select = document.getElementById("teruletSelect");

                teruletek
                    .sort((a, b) => a.localeCompare(b, "hu"))
                    .forEach(terulet => {
                        const option = document.createElement("option");
                        option.value = terulet;
                        option.textContent = terulet;
                        select.appendChild(option);
                    });

                select.disabled = false;
            })
            .catch(error => {
                document.getElementById("status").innerHTML = "❌ " + error.message;
            });
    }
);

function teruletValasztas() {
    const terulet = document.getElementById("teruletSelect").value;
    const input = document.getElementById("searchInput");
    const result = document.getElementById("result");

    if (!terulet) {
        input.disabled = true;
        input.value = "";
        result.innerHTML = "";
        return;
    }

    input.disabled = false;
    input.focus();
    result.innerHTML = "";
}

function kereses() {
    const terulet = document.getElementById("teruletSelect").value;
    const keresett = document.getElementById("searchInput").value.trim().toLowerCase();
    const result = document.getElementById("result");

    if (!terulet || !keresett) {
        result.innerHTML = "";
        return;
    }

    const talalatok = tableData.filter(item => {
        const rowTerulet = String(item.terulet).trim();
        const s1 = String(item.string1 ?? "").trim().toLowerCase();
        const s2 = String(item.string2 ?? "").trim().toLowerCase();
        const s3 = String(item.string3 ?? "").trim().toLowerCase();
        const s4 = String(item.string4 ?? "").trim().toLowerCase();

        return (
            rowTerulet === terulet &&
            (
                s1.includes(keresett) ||
                s2.includes(keresett) ||
                s3.includes(keresett) ||
                s4.includes(keresett)
            )
        );
    });

    if (talalatok.length === 0) {
        result.innerHTML = `<div class="nincs">Nincs találat</div>`;
        return;
    }

    result.innerHTML = talalatok
        .map(item => `<div class="sor">${escapeHtml(item.row)}</div>`)
        .join("");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
