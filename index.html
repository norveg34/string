<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --background: #f5f6f8;
            --container: white;
            --text: #111;
            --input: white;
            --border: #ccc;
            --primary: #007bff;
            --result-bg: #eaf3ff;
        }

        body.dark {
            --background: #111;
            --container: #1e1e1e;
            --text: #fff;
            --input: #2b2b2b;
            --border: #555;
            --primary: #4da3ff;
            --result-bg: #203449;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--container);
            padding: 20px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.15);

            text-align: center;

            outline: none;

        select:disabled {
            opacity: 0.6;

            font-size: 32px;

    </style>

</head>


<body>

<div class="container">

    <h2>String kereső</h2>

    <button
        id="themeButton"
        onclick="toggleTheme()"
    >
        🌙 Fekete mód
    </button>

    <div id="status">
        ⏳ Betöltés...
    </div>


    <!-- EXCEL -->

    <select
        id="fileSelect"
        onchange="excelValasztas()"
    >

        <option value="SLK2_combiner.xlsx">
            SLK2 Combiner
        </option>

        <option value="SLK1_combiner.xlsx">
            SLK1 Combiner
        </option>

    </select>


    <!-- TERÜLET -->

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >

        <option value="">
            Válassz területet
        </option>

    </select>


    <!-- STRING -->

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        oninput="kereses()"
        autocomplete="off"
    >


    <!-- EREDMÉNY -->

    <div id="result"></div>

</div>


<script>


/*
==========================================================
ADATOK
==========================================================
*/

let tableData = [];


/*
==========================================================
INDULÁS
==========================================================
*/

window.addEventListener("DOMContentLoaded", function () {

    /*
    Téma
    */

    const savedTheme =
        localStorage.getItem("theme");


    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";

    }


    /*
    Alapértelmezett Excel
    */

    excelBetoltes(
        "SLK2_combiner.xlsx"
    );

});


/*
==========================================================
FEKETE / FEHÉR MÓD
==========================================================
*/

function toggleTheme() {

    document.body.classList.toggle("dark");


    const dark =
        document.body.classList.contains("dark");


    if (dark) {

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";

        localStorage.setItem(
            "theme",
            "dark"
        );

    } else {

        document.getElementById(
            "themeButton"
        ).textContent = "🌙 Fekete mód";

        localStorage.setItem(
            "theme",
            "light"
        );

    }

}


/*
==========================================================
EXCEL VÁLASZTÁS
==========================================================
*/

function excelValasztas() {

    const file =
        document.getElementById(
            "fileSelect"
        ).value;


    excelBetoltes(file);

}


/*
==========================================================
EXCEL BETÖLTÉS
==========================================================
*/

function excelBetoltes(fileName) {

    const status =
        document.getElementById(
            "status"
        );


    const teruletSelect =
        document.getElementById(
            "teruletSelect"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    /*
    RESET
    */

    tableData = [];


    teruletSelect.innerHTML =
        '<option value="">Válassz területet</option>';


    teruletSelect.disabled = true;

    searchInput.disabled = true;

    searchInput.value = "";

    result.innerHTML = "";


    status.innerHTML =
        "⏳ " +
        fileName +
        " betöltése...";


    /*
    ======================================================
    EXCEL BETÖLTÉSE
    ======================================================
    */

    fetch(fileName)

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "Az Excel fájl nem található: " +
                    fileName
                );

            }

            return response.arrayBuffer();

        })


        .then(function (buffer) {

            /*
            Excel megnyitása
            */

            const workbook =
                XLSX.read(
                    buffer,
                    {
                        type: "array"
                    }
                );


            /*
            Első munkalap
            */

            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            /*
            ==================================================
            EXCEL BEOLVASÁS
            ==================================================
            */

            const rawData =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        header: 1,
                        defval: "",
                        raw: true
                    }
                );


            /*
            Ellenőrzés
            */

            if (
                !rawData ||
                rawData.length <= 1
            ) {

                throw new Error(
                    "Az Excel fájl üres!"
                );

            }


            /*
            ==================================================
            STRUKTÚRA
            ==================================================

            Excel:

            ROW
            STRING
            STRING
            STRING
            STRING
            TERULET

            Ezért:

            row[0] = ROW
            row[1] = STRING
            row[2] = STRING
            row[3] = STRING
            row[4] = STRING
            row[5] = TERULET
            ==================================================
            */


            tableData =
                rawData
                    .slice(1)
                    .map(function (row) {

                        return {

                            row:
                                row[0],

                            string1:
                                row[1],

                            string2:
                                row[2],

                            string3:
                                row[3],

                            string4:
                                row[4],

                            terulet:
                                row[5]

                        };

                    });


            /*
            ==================================================
            TERÜLETEK
            ==================================================
            */

            const teruletek =
                [
                    ...new Set(

                        tableData

                            .map(function (item) {

                                return String(
                                    item.terulet ?? ""
                                ).trim();

                            })

                            .filter(function (value) {

                                return (
                                    value !== "" &&
                                    value !== "undefined" &&
                                    value !== "null"
                                );

                            })

                    )
                ];


            /*
            ABC sorrend
            */

            teruletek.sort(
                function (a, b) {

                    return a.localeCompare(
                        b,
                        "hu"
                    );

                }
            );


            /*
            ==================================================
            TERÜLET SELECT FELTÖLTÉSE
            ==================================================
            */

            teruletek.forEach(
                function (terulet) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        terulet;


                    option.textContent =
                        terulet;


                    teruletSelect.appendChild(
                        option
                    );

                }
            );


            /*
            Engedélyezés
            */

            teruletSelect.disabled = false;


            /*
            Sikeres betöltés
            */

            status.innerHTML =
                "✅ Betöltve: " +
                tableData.length +
                " sor";


            /*
            Hibás struktúra ellenőrzése
            */

            if (
                teruletek.length === 0
            ) {

                status.innerHTML =
                    "⚠️ Nem található TERULET adat az Excelben.";

            }

        })


        .catch(function (error) {

            console.error(
                "Excel hiba:",
                error
            );


            status.innerHTML =
                "❌ " +
                error.message;

        });

}


/*
==========================================================
TERÜLET VÁLASZTÁS
==========================================================
*/

function teruletValasztas() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;


    const input =
        document.getElementById(
            "searchInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    /*
    Nincs kiválasztva
    */

    if (!terulet) {

        input.disabled = true;

        input.value = "";

        result.innerHTML = "";

        return;

    }


    /*
    Keresés engedélyezése
    */

    input.disabled = false;

    input.value = "";

    result.innerHTML = "";

    input.focus();

}


/*
==========================================================
KERESÉS
==========================================================
*/

function kereses() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;


    const keresett =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();


    const result =
        document.getElementById(
            "result"
        );


    /*
    Nincs keresés
    */

    if (
        !terulet ||
        !keresett
    ) {

        result.innerHTML = "";

        return;

    }


    /*
    ==================================================
    KERESÉS MIND A 4 STRINGBEN
    ==================================================
    */

    const talalatok =
        tableData.filter(
            function (item) {

                /*
                Terület
                */

                const itemTerulet =
                    String(
                        item.terulet ?? ""
                    )
                        .trim();


                if (
                    itemTerulet !== terulet
                ) {

                    return false;

                }


                /*
                STRING 1
                */

                const string1 =
                    String(
                        item.string1 ?? ""
                    )
                        .trim()
                        .toLowerCase();


                /*
                STRING 2
                */

                const string2 =
                    String(
                        item.string2 ?? ""
                    )
                        .trim()
                        .toLowerCase();


                /*
                STRING 3
                */

                const string3 =
                    String(
                        item.string3 ?? ""
                    )
                        .trim()
                        .toLowerCase();


                /*
                STRING 4
                */

                const string4 =
                    String(
                        item.string4 ?? ""
                    )
                        .trim()
                        .toLowerCase();


                /*
                Bármelyik STRING-ben
                */

                return (

                    string1.includes(
                        keresett
                    )

                    ||

                    string2.includes(
                        keresett
                    )

                    ||

                    string3.includes(
                        keresett
                    )

                    ||

                    string4.includes(
                        keresett
                    )

                );

            }
        );


    /*
    ==================================================
    NINCS TALÁLAT
    ==================================================
    */

    if (
        talalatok.length === 0
    ) {

        result.innerHTML =
            `
            <div class="nincs">
                Nincs találat
            </div>
            `;

        return;

    }


    /*
    ==================================================
    TALÁLATOK
    ==================================================
    */

    result.innerHTML =
        talalatok

            .map(
                function (item) {

                    return `
                        <div class="sor">
                            ${escapeHtml(item.row)}
                        </div>
                    `;

                }
            )

            .join("");

}


/*
==========================================================
HTML BIZTONSÁG
==========================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
