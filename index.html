<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007bff">
    <meta name="background-color" content="#f5f6f8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="String kereső">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007bff;
            margin: 0 0 15px;
        }

        select,
        input {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 17px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #007bff;
        }

        input:disabled,
        select:disabled {
            background: #eee;
        }

        #status {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }

        #result {
            text-align: center;
            margin-top: 20px;
        }

        .sor {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
            padding: 20px;
            border-radius: 10px;
            background: #eaf3ff;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .nincs {
            font-size: 18px;
            color: #777;
        }

        .offline {
            color: #d97706;
        }

        .online {
            color: #198754;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>String kereső</h2>

    <div id="status">
        ⏳ Betöltés...
    </div>

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">Válassz területet</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        oninput="kereses()"
    >

    <div id="result"></div>

</div>

<script>

let tableData = [];

/*
 * Service Worker regisztráció (Javítva az azonnali frissítéshez)
 */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .then(reg => {
                console.log("Service Worker regisztrálva.");
                // Ellenőrzi, hogy van-e frissítés
                reg.addEventListener("updatefound", () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener("statechange", () => {
                        if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                            console.log("Új verzió érhető el, frissítsd az oldalt.");
                        }
                    });
                });
            })
            .catch(error => {
                console.error("Service Worker hiba:", error);
            });
    });
}

/*
 * Online / offline állapot
 */
function frissitOnlineStatus() {
    const status = document.getElementById("status");
    if (navigator.onLine) {
        status.className = "online";
    } else {
        status.className = "offline";
    }
}

window.addEventListener("online", frissitOnlineStatus);
window.addEventListener("offline", frissitOnlineStatus);

/*
 * Excel betöltése
 */
window.addEventListener(
    "DOMContentLoaded",
    () => {
        frissitOnlineStatus();

        fetch("./SLK2_combiner.xlsx")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Az Excel fájl nem található!");
                }
                return response.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(
                    new Uint8Array(buffer),
                    { type: "array" }
                );

                const sheet = workbook.Sheets[workbook.SheetNames[0]];

                const rawData = XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        header: 1,
                        defval: ""
                    }
                );

                /*
                 * Excel oszlopok:
                 * A = ROW, B = 1. STRING, C = 2. STRING, D = 3. STRING, E = 4. STRING, F = TERULET
                 */
                tableData = rawData
                    .slice(1)
                    .map(row => ({
                        row: row[0],
                        string1: row[1],
                        string2: row[2],
                        string3: row[3],
                        string4: row[4],
                        terulet: row[5]
                    }));

                /*
                 * Területek kigyűjtése
                 */
                const teruletek = [
                    ...new Set(
                        tableData
                            .map(item => String(item.terulet).trim())
                            .filter(x => x !== "")
                    )
                ];

                const select = document.getElementById("teruletSelect");

                /*
                 * Területek rendezése
                 */
                teruletek
                    .sort((a, b) => a.localeCompare(b, "hu"))
                    .forEach(terulet => {
                        const option = document.createElement("option");
                        option.value = terulet;
                        option.textContent = terulet;
                        select.appendChild(option);
                    });

                select.disabled = false;

                document.getElementById("status").innerHTML =
                    navigator.onLine ? "✓ Betöltve" : "✓ Offline mód";

                setTimeout(() => {
                    document.getElementById("status").innerHTML = "";
                }, 3000);
            })
            .catch(error => {
                document.getElementById("status").innerHTML = "❌ " + error.message;
            });
    }
);

/*
 * Terület kiválasztása
 */
function teruletValasztas() {
    const terulet = document.getElementById("teruletSelect").value;
    const input = document.getElementById("searchInput");
    const result = document.getElementById("result");

    if (!terulet) {
        input.disabled = true;
        input.value = "";
        result.innerHTML = "";
        return;
    }

    input.disabled = false;
    input.focus();
    result.innerHTML = "";
}

/*
 * Keresés (1-4. STRING mezőkben)
 */
function kereses() {
    const terulet = document.getElementById("teruletSelect").value;
    const keresett = document.getElementById("searchInput").value.trim().toLowerCase();
    const result = document.getElementById("result");

    if (!terulet || !keresett) {
        result.innerHTML = "";
        return;
    }

    const talalatok = tableData.filter(item => {
        const rowTerulet = String(item.terulet).trim();
        const s1 = String(item.string1 ?? "").trim().toLowerCase();
        const s2 = String(item.string2 ?? "").trim().toLowerCase();
        const s3 = String(item.string3 ?? "").trim().toLowerCase();
        const s4 = String(item.string4 ?? "").trim().toLowerCase();

        return (
            rowTerulet === terulet &&
            (
                s1.includes(keresett) ||
                s2.includes(keresett) ||
                s3.includes(keresett) ||
                s4.includes(keresett)
            )
        );
    });

    if (talalatok.length === 0) {
        result.innerHTML = `<div class="nincs">Nincs találat</div>`;
        return;
    }

    result.innerHTML = talalatok
        .map(item => `<div class="sor">${escapeHtml(item.row)}</div>`)
        .join("");
}

/*
 * HTML escape
 */
function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
