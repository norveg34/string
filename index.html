<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --background: #f5f6f8;
            --container: white;
            --text: #111;
            --input: white;
            --border: #ccc;
            --primary: #007bff;
            --result-bg: #eaf3ff;
        }

        body.dark {
            --background: #111;
            --container: #1e1e1e;
            --text: #fff;
            --input: #2b2b2b;
            --border: #555;
            --primary: #4da3ff;
            --result-bg: #203449;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 15px;
            transition: 0.2s;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--container);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        select,
        input,
        button {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 17px;
            background: var(--input);
            color: var(--text);
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input:disabled,
        select:disabled {
            opacity: 0.6;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #result {
            text-align: center;
            margin-top: 20px;
        }

        .sor {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            padding: 20px;
            border-radius: 10px;
            background: var(--result-bg);
            margin-bottom: 10px;
        }

        .nincs {
            font-size: 18px;
            color: #777;
        }

    </style>

</head>


<body>

<div class="container">

    <h2>String kereső</h2>


    <button
        id="themeButton"
        onclick="toggleTheme()"
    >
        🌙 Fekete mód
    </button>


    <div id="status">
        ⏳ Betöltés...
    </div>


    <select
        id="fileSelect"
        onchange="excelValasztas()"
    >

        <option value="SLK2_combiner.xlsx">
            SLK2 Combiner
        </option>

        <option value="SLK1_combiner.xlsx">
            SLK1 Combiner
        </option>

    </select>


    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >

        <option value="">
            Válassz területet
        </option>

    </select>


    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        oninput="kereses()"
        autocomplete="off"
    >


    <div id="result"></div>

</div>


<script>

let tableData = [];


/*
==========================================================
INDULÁS
==========================================================
*/

window.addEventListener("DOMContentLoaded", () => {

    const savedTheme =
        localStorage.getItem("theme");

    if (savedTheme === "dark") {

        document.body.classList.add("dark");

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";

    }

    excelBetoltes("SLK2_combiner.xlsx");

});


/*
==========================================================
TÉMA
==========================================================
*/

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");


    if (dark) {

        document.getElementById(
            "themeButton"
        ).textContent = "☀️ Fehér mód";

        localStorage.setItem(
            "theme",
            "dark"
        );

    } else {

        document.getElementById(
            "themeButton"
        ).textContent = "🌙 Fekete mód";

        localStorage.setItem(
            "theme",
            "light"
        );

    }

}


/*
==========================================================
EXCEL VÁLTÁS
==========================================================
*/

function excelValasztas() {

    const file =
        document.getElementById(
            "fileSelect"
        ).value;

    excelBetoltes(file);

}


/*
==========================================================
EXCEL BETÖLTÉS
==========================================================
*/

function excelBetoltes(fileName) {

    const status =
        document.getElementById("status");

    const teruletSelect =
        document.getElementById(
            "teruletSelect"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const result =
        document.getElementById(
            "result"
        );


    /*
    RESET
    */

    tableData = [];

    teruletSelect.innerHTML =
        `<option value="">
            Válassz területet
        </option>`;

    teruletSelect.disabled = true;

    searchInput.disabled = true;
    searchInput.value = "";

    result.innerHTML = "";

    status.innerHTML =
        "⏳ " + fileName + " betöltése...";


    /*
    EXCEL BETÖLTÉSE
    */

    fetch(fileName)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Az Excel fájl nem található!"
                );

            }

            return response.arrayBuffer();

        })


        .then(buffer => {

            const workbook =
                XLSX.read(
                    new Uint8Array(buffer),
                    {
                        type: "array"
                    }
                );


            const sheet =
                workbook.Sheets[
                    workbook.SheetNames[0]
                ];


            /*
            Excel adatok
            */

            const rawData =
                XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        header: 1,
                        defval: ""
                    }
                );


            if (
                !rawData ||
                rawData.length < 2
            ) {

                throw new Error(
                    "Az Excel üres vagy nincs benne adat!"
                );

            }


            /*
            ==================================================
            FEJLÉC
            ==================================================
            */

            const headers =
                rawData[0].map(header =>
                    String(header)
                        .trim()
                        .toLowerCase()
                );


            console.log(
                "Excel fejléc:",
                headers
            );


            /*
            ==================================================
            OSZLOPOK MEGKERESÉSE
            ==================================================
            */

            let rowIndex = -1;

            let teruletIndex = -1;

            let stringIndexes = [];


            /*
            ROW oszlop
            */

            rowIndex =
                headers.findIndex(header =>
                    header === "row" ||
                    header === "sor" ||
                    header.includes("row")
                );


            /*
            TERÜLET oszlop
            */

            teruletIndex =
                headers.findIndex(header =>
                    header === "terület" ||
                    header === "terulet" ||
                    header.includes("terület") ||
                    header.includes("terulet")
                );


            /*
            STRING oszlopok
            */

            stringIndexes =
                headers
                    .map((header, index) => {

                        if (
                            header.includes("string")
                        ) {
                            return index;
                        }

                        return -1;

                    })
                    .filter(index => index !== -1);


            /*
            ==================================================
            HA NINCS FEJLÉC ALAPJÁN FELISMERÉS
            ==================================================
            */

            if (rowIndex === -1) {

                rowIndex = 0;

            }


            /*
            Ha nincs terület fejléc,
            próbáljuk a legutolsó oszlopot.
            */

            if (teruletIndex === -1) {

                teruletIndex =
                    rawData[0].length - 1;

            }


            /*
            Ha nincs STRING fejléc,
            akkor a ROW és TERÜLET közötti
            oszlopokat használjuk.
            */

            if (
                stringIndexes.length === 0
            ) {

                for (
                    let i = 0;
                    i < rawData[0].length;
                    i++
                ) {

                    if (
                        i !== rowIndex &&
                        i !== teruletIndex
                    ) {

                        stringIndexes.push(i);

                    }

                }

            }


            console.log(
                "ROW oszlop:",
                rowIndex
            );

            console.log(
                "STRING oszlopok:",
                stringIndexes
            );

            console.log(
                "TERÜLET oszlop:",
                teruletIndex
            );


            /*
            ==================================================
            ADATOK FELDOLGOZÁSA
            ==================================================
            */

            tableData =
                rawData
                    .slice(1)
                    .map(row => {

                        const strings =
                            stringIndexes.map(
                                index =>
                                    String(
                                        row[index] ?? ""
                                    ).trim()
                            );


                        return {

                            row:
                                row[rowIndex],

                            strings:
                                strings,

                            terulet:
                                String(
                                    row[teruletIndex] ?? ""
                                ).trim()

                        };

                    });


            /*
            Üres sorok kiszűrése
            */

            tableData =
                tableData.filter(item => {

                    return (
                        item.terulet !== "" ||
                        item.strings.some(
                            value => value !== ""
                        )
                    );

                });


            /*
            ==================================================
            TERÜLETEK
            ==================================================
            */

            const teruletek =
                [
                    ...new Set(

                        tableData
                            .map(item =>
                                item.terulet
                            )
                            .filter(
                                value =>
                                    value !== "" &&
                                    value !== "undefined" &&
                                    value !== "null"
                            )

                    )
                ];


            /*
            Területek rendezése
            */

            teruletek.sort(
                (a, b) =>
                    a.localeCompare(
                        b,
                        "hu"
                    )
            );


            /*
            Select feltöltése
            */

            teruletek.forEach(terulet => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    terulet;

                option.textContent =
                    terulet;

                teruletSelect.appendChild(
                    option
                );

            });


            /*
            Engedélyezés
            */

            teruletSelect.disabled = false;


            /*
            Státusz
            */

            status.innerHTML =
                "✅ " +
                tableData.length +
                " sor betöltve";


            /*
            Ha nincs terület
            */

            if (teruletek.length === 0) {

                status.innerHTML =
                    "⚠️ Nem található terület az Excelben";

            }

        })


        .catch(error => {

            console.error(error);

            status.innerHTML =
                "❌ " +
                error.message;

        });

}


/*
==========================================================
TERÜLET VÁLASZTÁS
==========================================================
*/

function teruletValasztas() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;


    const input =
        document.getElementById(
            "searchInput"
        );


    const result =
        document.getElementById(
            "result"
        );


    if (!terulet) {

        input.disabled = true;

        input.value = "";

        result.innerHTML = "";

        return;

    }


    input.disabled = false;

    input.value = "";

    result.innerHTML = "";

    input.focus();

}


/*
==========================================================
KERESÉS
==========================================================
*/

function kereses() {

    const terulet =
        document.getElementById(
            "teruletSelect"
        ).value;


    const keresett =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();


    const result =
        document.getElementById(
            "result"
        );


    if (
        !terulet ||
        !keresett
    ) {

        result.innerHTML = "";

        return;

    }


    /*
    ==================================================
    KERESÉS
    MINDEN STRING OSZLOPBAN
    ==================================================
    */

    const talalatok =
        tableData.filter(item => {

            /*
            Terület ellenőrzése
            */

            if (
                item.terulet !== terulet
            ) {

                return false;

            }


            /*
            STRING keresés
            */

            return item.strings.some(
                stringValue => {

                    return String(
                        stringValue
                    )
                        .toLowerCase()
                        .includes(
                            keresett
                        );

                }
            );

        });


    /*
    ==================================================
    NINCS TALÁLAT
    ==================================================
    */

    if (
        talalatok.length === 0
    ) {

        result.innerHTML =
            `<div class="nincs">
                Nincs találat
            </div>`;

        return;

    }


    /*
    ==================================================
    TALÁLATOK
    ==================================================
    */

    result.innerHTML =
        talalatok
            .map(item => {

                return `
                    <div class="sor">
                        ${escapeHtml(item.row)}
                    </div>
                `;

            })
            .join("");

}


/*
==========================================================
HTML BIZTONSÁG
==========================================================
*/

function escapeHtml(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
