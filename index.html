<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="background-color" content="#0d1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="String kereső">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            height: 100%;
        }

        /* Gemini stílusú pulzáló, áramló színes háttér */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117, #1a1c29, #0f172a);
            background-size: 300% 300%;
            animation: geminiPulse 12s ease infinite;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));
        }

        @keyframes geminiPulse {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 18px;
            font-size: 24px;
        }

        select,
        input {
            width: 100%;
            height: 50px;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 17px;
            background: rgba(13, 17, 23, 0.8);
            color: #e6edf3;
            transition: all 0.3s ease;
        }

        select option {
            background: #161b22;
            color: #e6edf3;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        input:disabled,
        select:disabled {
            background: rgba(13, 17, 23, 0.4);
            color: #6b7280;
            border-color: rgba(255, 255, 255, 0.05);
        }

        #status {
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
            color: #9ca3af;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        .sor {
            font-size: 32px;
            font-weight: bold;
            color: #f3f4f6;
            padding: 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 10px;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nincs {
            font-size: 18px;
            color: #9ca3af;
            padding: 10px;
        }

        .offline {
            color: #fbbf24;
        }

        .online {
            color: #34d399;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>String kereső</h2>

    <div id="status">
        ⏳ Betöltés...
    </div>

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">Válassz területet</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        oninput="kereses()"
    >

    <div id="result"></div>

</div>

<script>

let tableData = [];

/*
 * Service Worker regisztráció
 */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .then(reg => {
                console.log("Service Worker regisztrálva.");
                reg.addEventListener("updatefound", () => {
                    const newWorker = reg.installing;
                    newWorker.addEventListener("statechange", () => {
                        if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                            console.log("Új verzió érhető el.");
                        }
                    });
                });
            })
            .catch(error => {
                console.error("Service Worker hiba:", error);
            });
    });
}

/*
 * Online / offline állapot
 */
function frissitOnlineStatus() {
    const status = document.getElementById("status");
    if (navigator.onLine) {
        status.className = "online";
    } else {
        status.className = "offline";
    }
}

window.addEventListener("online", frissitOnlineStatus);
window.addEventListener("offline", frissitOnlineStatus);

/*
 * Excel betöltése
 */
window.addEventListener(
    "DOMContentLoaded",
    () => {
        frissitOnlineStatus();

        fetch("./SLK2_combiner.xlsx")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Az Excel fájl nem található!");
                }
                return response.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(
                    new Uint8Array(buffer),
                    { type: "array" }
                );

                const sheet = workbook.Sheets[workbook.SheetNames[0]];

                const rawData = XLSX.utils.sheet_to_json(
                    sheet,
                    {
                        header: 1,
                        defval: ""
                    }
                );

                tableData = rawData
                    .slice(1)
                    .map(row => ({
                        row: row[0],
                        string1: row[1],
                        string2: row[2],
                        string3: row[3],
                        string4: row[4],
                        terulet: row[5]
                    }));

                const teruletek = [
                    ...new Set(
                        tableData
                            .map(item => String(item.terulet).trim())
                            .filter(x => x !== "")
                    )
                ];

                const select = document.getElementById("teruletSelect");

                teruletek
                    .sort((a, b) => a.localeCompare(b, "hu"))
                    .forEach(terulet => {
                        const option = document.createElement("option");
                        option.value = terulet;
                        option.textContent = terulet;
                        select.appendChild(option);
                    });

                select.disabled = false;

                document.getElementById("status").innerHTML =
                    navigator.onLine ? "✓ Betöltve" : "✓ Offline mód";

                setTimeout(() => {
                    document.getElementById("status").innerHTML = "";
                }, 3000);
            })
            .catch(error => {
                document.getElementById("status").innerHTML = "❌ " + error.message;
            });
    }
);

/*
 * Terület kiválasztása
 */
function teruletValasztas() {
    const terulet = document.getElementById("teruletSelect").value;
    const input = document.getElementById("searchInput");
    const result = document.getElementById("result");

    if (!terulet) {
        input.disabled = true;
        input.value = "";
        result.innerHTML = "";
        return;
    }

    input.disabled = false;
    input.focus();
    result.innerHTML = "";
}

/*
 * Keresés
 */
function kereses() {
    const terulet = document.getElementById("teruletSelect").value;
    const keresett = document.getElementById("searchInput").value.trim().toLowerCase();
    const result = document.getElementById("result");

    if (!terulet || !keresett) {
        result.innerHTML = "";
        return;
    }

    const talalatok = tableData.filter(item => {
        const rowTerulet = String(item.terulet).trim();
        const s1 = String(item.string1 ?? "").trim().toLowerCase();
        const s2 = String(item.string2 ?? "").trim().toLowerCase();
        const s3 = String(item.string3 ?? "").trim().toLowerCase();
        const s4 = String(item.string4 ?? "").trim().toLowerCase();

        return (
            rowTerulet === terulet &&
            (
                s1.includes(keresett) ||
                s2.includes(keresett) ||
                s3.includes(keresett) ||
                s4.includes(keresett)
            )
        );
    });

    if (talalatok.length === 0) {
        result.innerHTML = `<div class="nincs">Nincs találat</div>`;
        return;
    }

    result.innerHTML = talalatok
        .map(item => `<div class="sor">${escapeHtml(item.row)}</div>`)
        .join("");
}

/*
 * HTML escape
 */
function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
