<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" id="themeColor">
    <meta name="description" content="String és combiner kereső Excel adatokhoz">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    <title>Combiner kereső</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        :root {
            color-scheme: light;
            --bg: #f5f6f8;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #ccc;
            --input: #ffffff;
            --disabled: #eee;
            --primary: #007bff;
            --result-bg: #eaf3ff;
            --shadow: 0 3px 12px rgba(0,0,0,.10);
        }
        body.dark {
            color-scheme: dark;
            --bg: #111827;
            --card: #1f2937;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #4b5563;
            --input: #111827;
            --disabled: #374151;
            --primary: #60a5fa;
            --result-bg: #172554;
            --shadow: 0 3px 14px rgba(0,0,0,.35);
        }
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            padding-top: max(15px, env(safe-area-inset-top));
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            transition: background .2s, color .2s;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        h2 { text-align: center; color: var(--primary); margin: 0; flex: 1; }
        .modeButton {
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            border-radius: 8px;
            min-width: 48px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
        }
        select, input {
            width: 100%; height: 50px; padding: 10px; margin-bottom: 12px;
            border: 1px solid var(--border); border-radius: 8px; font-size: 17px;
            background: var(--input); color: var(--text);
        }
        select:focus, input:focus { outline: none; border-color: var(--primary); }
        input:disabled, select:disabled { background: var(--disabled); }
        #status { text-align: center; font-size: 14px; margin-bottom: 15px; color: var(--muted); }
        #result { text-align: center; margin-top: 20px; }
        .sor {
            font-size: 32px; font-weight: bold; color: var(--primary); padding: 20px;
            border-radius: 10px; background: var(--result-bg); margin-bottom: 10px;
            overflow-wrap: anywhere;
        }
        .nincs { font-size: 18px; color: var(--muted); }
        .install {
            display: none; width: 100%; border: 0; border-radius: 8px; padding: 12px;
            margin-bottom: 12px; background: var(--primary); color: white; font-size: 16px; cursor: pointer;
        }
        .label { display:block; font-size:13px; color:var(--muted); margin: 4px 0 6px; }
    </style>
</head>
<body>
<div class="container">
    <div class="topbar">
        <h2>String kereső</h2>
        <button id="modeButton" class="modeButton" type="button" aria-label="Fekete-fehér mód váltása">🌙</button>
    </div>

    <button id="installButton" class="install">📲 Telepítés alkalmazásként</button>
    <div id="status">⏳ Betöltés...</div>

    <label class="label" for="sourceSelect">Adatforrás</label>
    <select id="sourceSelect" onchange="forrasValasztas()">
        <option value="SLK2_String.xlsx">SLK2 String</option>
        <option value="SLK2_combiner.xlsx">SLK2 Combiner</option>
        <option value="SLK1_combiner.xlsx">SLK1 Combiner</option>
    </select>

    <label class="label" for="teruletSelect">Terület</label>
    <select id="teruletSelect" disabled onchange="teruletValasztas()">
        <option value="">Válassz területet</option>
    </select>

    <input type="text" id="searchInput" placeholder="Írd be a stringet..." disabled oninput="kereses()">
    <div id="result"></div>
</div>

<script>
let tableData = [];
let deferredPrompt;
const sourceSelect = document.getElementById("sourceSelect");
const teruletSelect = document.getElementById("teruletSelect");
const searchInput = document.getElementById("searchInput");
const result = document.getElementById("result");
const status = document.getElementById("status");
const modeButton = document.getElementById("modeButton");
const themeColor = document.getElementById("themeColor");

function beallitMod() {
    const dark = localStorage.getItem("string-kereso-dark") === "1";
    document.body.classList.toggle("dark", dark);
    modeButton.textContent = dark ? "☀️" : "🌙";
    modeButton.title = dark ? "Fehér mód" : "Fekete mód";
    themeColor.content = dark ? "#111827" : "#ffffff";
}

modeButton.addEventListener("click", () => {
    const dark = !document.body.classList.contains("dark");
    localStorage.setItem("string-kereso-dark", dark ? "1" : "0");
    beallitMod();
});

async function excelBetoltes(fileName) {
    status.textContent = `⏳ ${fileName} betöltése...`;
    teruletSelect.disabled = true;
    searchInput.disabled = true;
    result.innerHTML = "";
    teruletSelect.innerHTML = '<option value="">Válassz területet</option>';

    try {
        const response = await fetch(fileName, { cache: "no-cache" });
        if (!response.ok) throw new Error(`${fileName} nem található!`);
        const buffer = await response.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(buffer), { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        // Az oszlopokat fejléc alapján keressük, így nem számít, melyik oszlopban van a TERULET.
        const headers = (rawData[0] || []).map(value =>
            String(value ?? "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        );

        const findColumn = (...names) => {
            for (const name of names) {
                const normalized = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const index = headers.findIndex(h => h === normalized);
                if (index !== -1) return index;
            }
            return -1;
        };

        const rowIndex = findColumn("row", "sor");
        const teruletIndex = findColumn("terulet", "terület", "area");
        const stringIndexes = headers
            .map((header, index) => ({ header, index }))
            .filter(x => x.header.includes("string"))
            .map(x => x.index);

        // Ha nincs felismerhető fejléc, a régi 6 oszlopos elrendezést használjuk.
        const finalRowIndex = rowIndex >= 0 ? rowIndex : 0;
        const finalTeruletIndex = teruletIndex >= 0 ? teruletIndex : 5;
        const finalStringIndexes = stringIndexes.length
            ? stringIndexes.slice(0, 4)
            : [1, 2, 3, 4];

        tableData = rawData.slice(1).map(row => ({
            row: row[finalRowIndex],
            string1: row[finalStringIndexes[0] ?? -1],
            string2: row[finalStringIndexes[1] ?? -1],
            string3: row[finalStringIndexes[2] ?? -1],
            string4: row[finalStringIndexes[3] ?? -1],
            terulet: row[finalTeruletIndex]
        })).filter(item => item.terulet !== undefined && item.terulet !== null && String(item.terulet).trim() !== "");

        const teruletek = [...new Set(
            tableData.map(item => String(item.terulet).trim()).filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "hu"));

        teruletek.forEach(terulet => {
            const option = document.createElement("option");
            option.value = terulet;
            option.textContent = terulet;
            teruletSelect.appendChild(option);
        });

        teruletSelect.disabled = false;
        status.textContent = `✅ ${fileName}: ${tableData.length} sor`;
    } catch (error) {
        status.textContent = "❌ " + error.message;
        tableData = [];
    }
}

function forrasValasztas() {
    excelBetoltes(sourceSelect.value);
}

function teruletValasztas() {
    if (!teruletSelect.value) {
        searchInput.disabled = true;
        searchInput.value = "";
        result.innerHTML = "";
        return;
    }
    searchInput.disabled = false;
    searchInput.focus();
    result.innerHTML = "";
}

function kereses() {
    const terulet = teruletSelect.value;
    const keresett = searchInput.value.trim().toLowerCase();
    if (!terulet || !keresett) {
        result.innerHTML = "";
        return;
    }

    const talalatok = tableData.filter(item => {
        const rowTerulet = String(item.terulet).trim();
        const strings = [item.string1, item.string2, item.string3, item.string4]
            .map(value => String(value ?? "").trim().toLowerCase());
        return rowTerulet === terulet && strings.some(value => value.includes(keresett));
    });

    if (talalatok.length === 0) {
        result.innerHTML = '<div class="nincs">Nincs találat</div>';
        return;
    }
    result.innerHTML = talalatok.map(item =>
        `<div class="sor">${escapeHtml(item.row)}</div>`
    ).join("");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPrompt = event;
    document.getElementById("installButton").style.display = "block";
});

document.getElementById("installButton").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installButton").style.display = "none";
});

window.addEventListener("appinstalled", () => {
    document.getElementById("installButton").style.display = "none";
});

window.addEventListener("DOMContentLoaded", () => {
    beallitMod();
    excelBetoltes(sourceSelect.value);
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(err => console.warn("PWA service worker:", err));
    }
});
</script>
</body>
</html>
