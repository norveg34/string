<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc" id="metaThemeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="String kereső">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>String kereső</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        /* VILÁGOS MÓD - Prémium, sima Gemini hullám */
        body.light-mode {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f1f5f9, #e0f2fe, #fce7f3, #fef3c7, #e2e8f0);
            background-size: 400% 400%;
            animation: geminiWaveFlow 16s ease infinite;
            color: #0f172a;
        }

        /* SÖTÉT MÓD - Mély, elegáns Gemini hullám */
        body.dark-mode {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #030712, #0f172a, #1e1b4b, #2e1065, #020617);
            background-size: 400% 400%;
            animation: geminiWaveFlow 16s ease infinite;
            color: #f8fafc;
        }

        @keyframes geminiWaveFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 30px 24px;
            border-radius: 28px;
            position: relative;
            z-index: 2;
        }

        body.light-mode .container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        body.dark-mode .container {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .theme-toggle {
            position: absolute;
            top: 22px;
            right: 22px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
        }

        body.light-mode .theme-toggle {
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }
        body.light-mode .theme-toggle:hover {
            background: rgba(15, 23, 42, 0.08);
        }

        body.dark-mode .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        h2 {
            text-align: left;
            margin: 0 0 24px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        body.light-mode h2 {
            background: linear-gradient(135deg, #1e293b, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark-mode h2 {
            background: linear-gradient(135deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        select,
        input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            margin-bottom: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
        }

        body.light-mode select,
        body.light-mode input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.8);
            color: #0f172a;
        }
        body.light-mode select:hover,
        body.light-mode input:hover {
            border-color: #94a3b8;
        }

        body.dark-mode select,
        body.dark-mode input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }
        body.dark-mode select:hover,
        body.dark-mode input:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        body.dark-mode select option {
            background: #0f172a;
            color: #f8fafc;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        input:disabled,
        select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
            min-height: 15px;
        }
        body.light-mode #status { color: #ef4444; }
        body.dark-mode #status { color: #f87171; }

        #result {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-top: 24px;
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 4px;
        }

        /* PRÉMIUM MOZGÓ BUBORÉKOK */
        .sor {
            min-width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            padding: 10px;
            text-align: center;
            word-break: break-all;
            animation: bubblePulse 5s ease-in-out infinite, bubbleAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .sor:nth-child(odd) { animation-duration: 4.2s; }
        .sor:nth-child(even) { animation-duration: 5.8s; animation-delay: 0.4s; }

        @keyframes bubblePulse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.04); }
        }

        body.light-mode .sor {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(241, 245, 249, 0.9));
            border: 2px solid rgba(139, 92, 246, 0.35);
            color: #1e293b;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 0 15px rgba(255, 255, 255, 0.8) inset;
        }

        body.dark-mode .sor {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 2px solid rgba(168, 85, 247, 0.45);
            color: #f8fafc;
            box-shadow: 0 12px 30px -5px rgba(139, 92, 246, 0.3), 0 0 20px rgba(168, 85, 247, 0.15) inset;
        }

        @keyframes bubbleAppear {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .nincs {
            font-size: 15px;
            font-weight: 500;
            padding: 15px;
            width: 100%;
            text-align: center;
        }
        body.light-mode .nincs { color: #64748b; }
        body.dark-mode .nincs { color: #94a3b8; }
    </style>
</head>

<body class="light-mode" id="pageBody">

<div class="container">
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Téma váltása">🌙</button>

    <h2>String kereső</h2>

    <div id="status"></div>

    <select
        id="teruletSelect"
        disabled
        onchange="teruletValasztas()"
    >
        <option value="">Válassz területet</option>
    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Írd be a stringet..."
        disabled
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        oninput="kereses()"
    >

    <div id="result"></div>

</div>

<script>
(function() {
    const savedTheme = localStorage.getItem("theme") || "light-mode";
    const body = document.getElementById("pageBody");
    const btn = document.getElementById("themeToggleBtn");
    const metaTheme = document.getElementById("metaThemeColor");

    body.className = savedTheme;
    if (savedTheme === "dark-mode") {
        btn.textContent = "☀️";
        metaTheme.content = "#030712";
    } else {
        btn.textContent = "🌙";
        metaTheme.content = "#f8fafc";
    }
})();

function toggleTheme() {
    const body = document.getElementById("pageBody");
    const btn = document.getElementById("themeToggleBtn");
    const metaTheme = document.getElementById("metaThemeColor");

    if (body.classList.contains("light-mode")) {
        body.className = "dark-mode";
        btn.textContent = "☀️";
        metaTheme.content = "#030712";
        localStorage.setItem("theme", "dark-mode");
    } else {
        body.classList.contains("dark-mode")
        body.className = "light-mode";
        btn.textContent = "🌙";
        metaTheme.content = "#f8fafc";
        localStorage.setItem("theme", "light-mode");
    }
}

let tableData = [];

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .catch(error => console.error("Service Worker hiba:", error));
    });
}

/*
 * Két Excel fájl betöltése párhuzamosan (SLK1 és SLK2)
 */
window.addEventListener(
    "DOMContentLoaded",
    () => {
        Promise.all([
            fetch("./SLK1_combiner.xlsx").then(res => {
                if (!res.ok) throw new Error("Az SLK1_combiner.xlsx nem található!");
                return res.arrayBuffer();
            }),
            fetch("./SLK2_combiner.xlsx").then(res => {
                if (!res.ok) throw new Error("Az SLK2_combiner.xlsx nem található!");
                return res.arrayBuffer();
            })
        ])
        .then(([buf1, buf2]) => {
            // SLK1 feldolgozása
            const wb1 = XLSX.read(new Uint8Array(buf1), { type: "array" });
            const sheet1 = wb1.Sheets[wb1.SheetNames[0]];
            const raw1 = XLSX.utils.sheet_to_json(sheet1, { header: 1, defval: "" });
            const data1 = raw1.slice(1).map(row => ({
                row: row[0],
                string1: row[1],
                string2: row[2],
                string3: row[3],
                string4: row[4],
                terulet: row[5]
            }));

            // SLK2 feldolgozása
            const wb2 = XLSX.read(new Uint8Array(buf2), { type: "array" });
            const sheet2 = wb2.Sheets[wb2.SheetNames[0]];
            const raw2 = XLSX.utils.sheet_to_json(sheet2, { header: 1, defval: "" });
            const data2 = raw2.slice(1).map(row => ({
                row: row[0],
                string1: row[1],
                string2: row[2],
                string3: row[3],
                string4: row[4],
                terulet: row[5]
            }));

            // Adatok egyesítése egy tömbbe
            tableData = [...data1, ...data2];

            const teruletek = [
                ...new Set(
                    tableData
                        .map(item => String(item.terulet).trim())
                        .filter(x => x !== "")
                )
            ];

            const select = document.getElementById("teruletSelect");

            teruletek
                .sort((a, b) => a.localeCompare(b, "hu"))
                .forEach(terulet => {
                    const option = document.createElement("option");
                    option.value = terulet;
                    option.textContent = terulet;
                    select.appendChild(option);
                });

            select.disabled = false;
        })
        .catch(error => {
            document.getElementById("status").innerHTML = "❌ " + error.message;
        });
    }
);

function teruletValasztas() {
    const terulet = document.getElementById("teruletSelect").value;
    const input = document.getElementById("searchInput");
    const result = document.getElementById("result");

    if (!terulet) {
        input.disabled = true;
        input.value = "";
        result.innerHTML = "";
        return;
    }

    input.disabled = false;
    input.focus();
    result.innerHTML = "";
}

function kereses() {
    const terulet = document.getElementById("teruletSelect").value;
    const keresett = document.getElementById("searchInput").value.trim().toLowerCase();
    const result = document.getElementById("result");

    if (!terulet || !keresett) {
        result.innerHTML = "";
        return;
    }

    const talalatok = tableData.filter(item => {
        const rowTerulet = String(item.terulet).trim();
        const s1 = String(item.string1 ?? "").trim().toLowerCase();
        const s2 = String(item.string2 ?? "").trim().toLowerCase();
        const s3 = String(item.string3 ?? "").trim().toLowerCase();
        const s4 = String(item.string4 ?? "").trim().toLowerCase();

        return (
            rowTerulet === terulet &&
            (
                s1.includes(keresett) ||
                s2.includes(keresett) ||
                s3.includes(keresett) ||
                s4.includes(keresett)
            )
        );
    });

    if (talalatok.length === 0) {
        result.innerHTML = `<div class="nincs">Nincs találat</div>`;
        return;
    }

    result.innerHTML = talalatok
        .map(item => `<div class="sor">${escapeHtml(item.row)}</div>`)
        .join("");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
